name: Release

# A `v*` tag (or a run by hand) builds Nida.app for Apple silicon on macOS 15
# — the libraries it carries then open on macOS 15 and later — and puts the
# DMG in a draft release, published by hand once it has been tried. See
# scripts/ci/build-macos.sh. Only macOS for now: Nida's Linux and Windows
# builds are untried.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0), already pushed'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS DMG (Apple silicon)
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: The tag is the version Cargo.toml gives
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::The tag is $TAG but Cargo.toml says $VERSION"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Homebrew itself as new as the formulae: the source archive reads
      # them from homebrew-core, in today's syntax.
      - name: Install build tools
        run: |
          brew update
          brew install pkgconf cmake

      - name: Build Nida.app and the DMG
        run: |
          set -o pipefail
          scripts/ci/build-macos.sh 2>&1 | tee build.log

      # The log needs a GitHub login to read; an annotation does not.
      - name: Say why the build failed
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          python3 - <<'PY'
          lines = open("build.log", errors="replace").readlines()[-60:]
          text = "".join(lines).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Build failed (last lines of its log)::" + text)
          PY

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Nida ${{ env.VERSION }}
          draft: true
          prerelease: ${{ contains(env.TAG, '-') }}
          body: |
            For Macs with Apple silicon, macOS 15 or later. Open the DMG and drag Nida to Applications.

            Nida is not signed by Apple: the first time, macOS says it cannot check it. Open **System Settings → Privacy & Security** and click **Open Anyway** next to Nida — once. For NDI, install the free NDI runtime from [ndi.video](https://ndi.video) — the NDI SDK for Apple, or `brew install --cask libndi`.

            Nida is built on [Varda](https://github.com/im-knots/varda) by im-knots. Its source is MIT; the app carries FFmpeg built with GPL parts, so the download as a whole is under the GPL version 3 (licences in `Nida.app/Contents/Resources/licenses`).

            Source, for the GPL: Nida's own, with the code it vendors (`vendor/`), is this tag — the Source code archives below. The other Rust crates built into it are on crates.io at the versions its `Cargo.lock` names (`cargo fetch` downloads them). Every library inside the app — FFmpeg and the rest from Homebrew, with their resources and patches and the formulae that built them — is in `Nida-${{ env.VERSION }}-third-party-source.tar.gz`. `scripts/ci/build-macos.sh` builds the app from all of it.
          files: |
            Nida-${{ env.VERSION }}-macOS-arm64.dmg
            Nida-${{ env.VERSION }}-macOS-arm64.dmg.sha256
            Nida-${{ env.VERSION }}-third-party-source.tar.gz
