[package]
name = "varda"
version = "0.9.0"
edition = "2021"
authors = ["Varda Contributors"]
description = "Linux, MacOS, and Windows VJ software"
license = "MIT"

[lib]
name = "varda"
path = "src/lib.rs"

# `clippy::pedantic` is a warn-by-default gate for every target (lib, bin, tests,
# benches, examples). CI runs `cargo clippy --all-targets -- -D warnings`, so these
# warnings are hard errors on a PR. Every entry in the allow-list below carries a
# rationale, and adding one requires the same. All but `too_many_lines` are lints
# whose advice is wrong for this codebase rather than work being deferred. See
# CONTRIBUTING.md § Lints.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Pixel, sample, and vertex math converts between integer extents and float
# coordinates constantly (`width as f32`, `f64 as f32` for shader uniforms).
# The conversions are intentional and the lossless alternatives either do not
# exist or push `try_from` error handling into the render hot path.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

# Fires on essentially every `&self` snapshot/query accessor in the engine trait
# impls — 478 attributes that catch no bugs, since ignoring an infallible getter
# is already dead code the compiler flags elsewhere.
must_use_candidate = "allow"

# The only deferred entry: ~130 functions exceed 100 lines, and splitting them is a
# real refactor rather than a lint fix. Tracked in spec/roadmap.md § DEBT: Function
# Decomposition; lower the threshold as offenders are cleared instead of flipping
# this off at the end.
too_many_lines = "allow"

[dependencies]
# Graphics
wgpu = "30.0"
winit = "0.30"
bytemuck = { version = "1.25", features = ["derive"] }
half = "2.6"

# Shader compilation (build-from-source ensures static linking — avoids
# libshaderc_shared.dylib runtime errors when users have Homebrew shaderc)
shaderc = { version = "0.10", features = ["build-from-source"] }
naga = { version = "30.0", features = ["spv-in", "wgsl-out"] }

# ISF metadata parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UI
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = { version = "0.36", features = ["accesskit"] }

# File system
notify = "8.2"
walkdir = "2.5"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
env_logger = "0.11"
log = "0.4"

# Async runtime
pollster = "0.4"
cpal = "0.17.3"
rustfft = "6.4.1"
crossbeam-channel = "0.5.15"
ffmpeg-next = "9.0.0"
rosc = "0.11.4"
image = "0.25.10"
rfd = "0.17.2"
libc = "0.2"
snap = "1.1.1"
nokhwa = { version = "0.10.10", features = ["input-native", "output-threaded"] }
midir = "0.11"
yuvutils-rs = "0.8.3"
geo = "0.33.1"
sysinfo = "0.38.4"
# `time` is here for the Linux screen-cast portal: zbus arms timeouts on the
# runtime that drives it, and without the time driver those panic at runtime
# rather than failing to compile. See spec/screen-capture.md § Platform Support.
tokio = { version = "1.52.2", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.6.10", features = ["cors", "fs"] }
futures-util = "0.3.32"
libloading = "0.9.0"
futures-lite = "2.6.1"
uuid = { version = "1.23.1", features = ["v4"] }
json-patch = "4.2.0"
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
ctrlc = "3.5.2"
imageproc = "0.26.2"
# SVG. `usvg` parses to a resolved tree (stage plan import walks it for contours);
# `resvg` rasterizes that same tree for SVG image decks, at whatever size the
# master resolution calls for. Pinned to one minor so both share a tree type.
# Default features on: real artwork carries text and embedded rasters.
usvg = "0.47.0"
resvg = "0.47.0"
dxf = "0.6.1"
base64 = "0.22.1"
dirs = "6.0.0"
# The time of day, for timers that show it or count to it.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
arc-swap = "1.9.1"
# ONNX Runtime is statically linked via ort's default `download-binaries`
# feature (CPU build). No dylib to locate, bundle, or version-match.
ort = { version = "2.0.0-rc.12", optional = true }
ndarray = { version = "0.17.2", optional = true }
servo = { version = "0.1.0", optional = true }
url = { version = "2.5", optional = true }
euclid = { version = "0.22", optional = true }
keyboard-types = { version = "0.8", optional = true }
# Depth sensor backend (Kinect v1 via libfreenect). Native FFI dep; see
# spec/depth-sensors.md. Gated behind the default-on `depth` feature. Builds
# without libfreenect installed must pass `--no-default-features` (or drop
# `depth` from the feature set).
freenectrs = { version = "0.1.0", optional = true }
# Scratch workspaces for tests (src/testing.rs). Also a dev-dependency, which
# covers unit tests; this entry is what makes the helper reachable from
# integration tests, where the lib is built as a plain dependency.
tempfile = { version = "3.27.0", optional = true }
egui_dock = { version = "0.21.1", features = ["serde"] }

# Syphon client FFI (macOS only). The syphon module is compiled unconditionally
# on macOS; Syphon.framework itself is dlopen'd at runtime (via libloading), so
# these crates are the only build-time additions.
[target.'cfg(target_os = "macos")'.dependencies]
objc2            = "0.6"
objc2-foundation = "0.3"
# IOSurface: captured screens reach the GPU as the surfaces macOS captured
# them into (src/internal/screen_capture/surface.rs), never through memory.
objc2-metal      = { version = "0.3", features = ["objc2-io-surface"] }
# Named for its default features: without them its surfaces are not
# CoreFoundation types, and objc2-core-video's IOSurface calls do not build —
# a release build without the default features showed it.
objc2-io-surface = "0.3"
# Blocks for AppKit callbacks: the screen colour sampler, screen capture.
block2           = "0.6"

# ScreenCaptureKit for the macOS screen/window capture backend (spec/screen-capture.md).
# These are objc2-family crates from the same maintainer as the three above, so
# they unify on objc2 0.6 / objc2-foundation 0.3 with no duplicate tree — the
# same version alignment external-io.md verified for the wgpu-hal Metal interop.
objc2-screen-capture-kit = { version = "0.3", optional = true }
# Also for the control window's screen held at the show's rate
# (src/internal/screen_rate.rs), with or without screen capture.
objc2-core-graphics      = "0.3"
# Cameras on a Mac come straight from AVFoundation (src/internal/camera/avf.rs):
# nokhwa cuts their rates down to whole numbers and refuses a device a hair
# under one (an ATEM at 60p says 59.9999), and its capture never returns once
# a device is unplugged. The media, video and dispatch crates serve screen
# capture as well.
objc2-av-foundation      = { version = "0.3", default-features = false, features = [
    "std",
    "AVCaptureDevice",
    "AVCaptureInput",
    "AVCaptureOutputBase",
    "AVCaptureSession",
    "AVCaptureSessionPreset",
    "AVCaptureVideoDataOutput",
    "AVMediaFormat",
    "dispatch2",
    "objc2-core-media",
] }
objc2-core-media         = "0.3"
objc2-core-video         = { version = "0.3", features = ["objc2-io-surface"] }
# The stream's video encoded in Nida itself, so its bit rate can change while
# it is live (src/internal/streaming/vt_encoder.rs): ffmpeg's encoders take
# theirs once.
objc2-video-toolbox      = { version = "0.3", default-features = false, features = [
    "std",
    "VTBase",
    "VTCompressionProperties",
    "VTCompressionSession",
    "VTErrors",
    "VTSession",
    "objc2-core-media",
    "objc2-core-video",
] }
objc2-core-foundation    = "0.3"
dispatch2                = "0.3"
# An app's sound taken straight from it — a Zoom or Teams call's — with a
# Core Audio process tap (src/internal/audio/app_sound.rs): no driver.
objc2-core-audio         = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "objc2-foundation",
    "AudioHardware",
] }
# What macOS calls each screen, and the Identify overlay that puts each
# screen's name on it (src/app/screens.rs).
objc2-app-kit            = { version = "0.3", default-features = false, features = [
    "std",
    # CGFloat sizes and colours: a release build has no other crate asking.
    "objc2-core-foundation",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSGraphics",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSText",
    "NSTextField",
    "NSView",
    "NSWindow",
] }

# Windows Graphics Capture for the Windows screen/window capture backend
# (spec/screen-capture.md). Microsoft-maintained, so no third-party binding.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux screen/window capture (spec/screen-capture.md). Two stacks in one
# binary, chosen at runtime: the XDG portal + PipeWire under Wayland, X11
# otherwise. A distro package is built once and has to serve both sessions.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", optional = true, features = ["randr"] }
# `screencast` gates the portal module this backend is built on; without it
# ashpd compiles to an empty desktop namespace and the Wayland path fails to
# resolve. Kept alongside `default-features = false` so the other portals stay out.
ashpd = { version = "0.13", optional = true, default-features = false, features = ["tokio", "screencast"] }
pipewire = { version = "0.10", optional = true }

[features]
default = ["face-detection", "html", "depth", "screen-capture"]
# ML-backed analyzers (ONNX Runtime + ndarray). Disabled for the x86_64 macOS
# slice to keep the Intel build ort-free. See spec/plugin-architecture.md (decision 5).
face-detection = ["dep:ort", "dep:ndarray"]
# HTML deck source (Servo offscreen render → wgpu). See spec/html-source.md.
# Only the servo_backend module is gated — the HtmlManager integration surface
# always compiles, so all integration/persistence/UI/API code and tests build
# without this feature.
#
# ON BY DEFAULT: the backend uses Servo's built-in SoftwareRenderingContext and
# CPU readback (read_to_image) rather than zero-copy GPU interop. This avoids the
# grafting/servo-wgpu-interop-adapter dependency (which does not compile on macOS
# against wgpu 29), so the backend builds cleanly on every target. The tradeoff is
# software GL rasterization (slower than GPU); zero-copy GPU import is a follow-up.
# Servo is heavy to build but the feature is stable, so it ships in the default
# profile. Disable with `--no-default-features` (re-add `face-detection` as needed).
# See spec/html-source.md "Decision: html on by default".
html = ["dep:servo", "dep:url", "dep:euclid", "dep:keyboard-types"]
# Depth sensor / point-cloud input (Kinect v1 via libfreenect). Default-on
# (opt out with `--no-default-features`): only the FreenectBackend module is
# gated — the DepthSensorManager integration surface (manager, deck integration,
# persistence, API, UI, tests) always compiles via a mock backend when the
# feature is off. See spec/depth-sensors.md.
depth = ["dep:freenectrs"]
# Screen / window capture deck source. Default-on: only the platform backend
# internals are gated — the ScreenCaptureManager integration surface (manager,
# deck integration, persistence, API, UI, tests) always compiles via the mock
# backend when the feature is off, mirroring `depth`. macOS uses
# ScreenCaptureKit, Windows uses Windows.Graphics.Capture, and Linux uses the
# XDG portal + PipeWire on Wayland or GetImage on X11. The `dep:` entries below
# are target-scoped, so each platform pulls only its own bindings.
# See spec/screen-capture.md.
screen-capture = ["dep:objc2-screen-capture-kit", "dep:windows", "dep:x11rb", "dep:ashpd", "dep:pipewire"]
test-fixtures = ["dep:tempfile"]
url = ["dep:url"]
euclid = ["dep:euclid"]
keyboard-types = ["dep:keyboard-types"]

[build-dependencies]
# Blackmagic outputs: a small C++ face on the DeckLink API (build.rs).
cc = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
proptest = "1.9"
# Honor the caller's feature selection in tests too. In particular, Windows
# builds exclude `depth`, whose native libfreenect dependency is unavailable.
varda = { path = ".", default-features = false, features = ["test-fixtures"] }

[[bench]]
name = "compositing"
harness = false

[[bench]]
name = "shader_params"
harness = false

[[bench]]
name = "audio_analysis"
harness = false

[[bench]]
name = "polygon_render"
harness = false

[[bench]]
name = "html_render"
harness = false

[[bench]]
name = "uuid_resolution"
harness = false

[[bench]]
name = "depth_preprocess"
harness = false

[[bench]]
name = "modulation_engine"
harness = false

[[bench]]
name = "presentation"
harness = false


# Dev and test builds carry line tables only: panics and backtraces keep
# file and line, and the build cache is a fraction of the size — full debug
# info in every test binary and dependency filled the Mac's disk (75 GB of
# target/ on 2026-10-08, growing by tens of GB a day). Not incremental:
# builds here go from scratch per change, and its cache only grew.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# NOTE: panic = "unwind" is required — multiple subsystems use catch_unwind
# to isolate panics from corrupted media files, third-party imageproc code,
# and background threads (see src/app/render.rs, src/usecases/api/runner.rs,
# src/internal/surface/import.rs). Using "abort" makes all of those dead
# code and any panic on any thread kills the process during a live show.
panic = "unwind"

[profile.bench]
debug = true
strip = "none"

# Metal's presentDrawable:afterMinimumDuration: for even frame pacing on
# ProMotion screens, which wgpu does not expose. See vendor/wgpu-hal/NIDA-PATCH.md.
[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }
