[package]
name = "nida-keep-awake-native"
version = "0.0.0"
edition = "2021"
publish = false

# Compile the production module without the application's GPU/FFmpeg dependencies.
[workspace]

[[bin]]
name = "keep-awake"
path = "main.rs"

[dependencies]
log = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_System_Threading", "Win32_System_SystemServices"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
